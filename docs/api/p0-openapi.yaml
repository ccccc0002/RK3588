components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    StreamId:
      name: streamId
      in: path
      required: true
      schema:
        type: string

  responses:
    UnauthorizedError:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    ForbiddenError:
      description: Token is valid but role lacks required action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    BadRequestError:
      description: Request payload failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'

  schemas:
    ApiMeta:
      type: object
      additionalProperties: true

    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ApiSuccessEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          additionalProperties: true
        error:
          type: object
          nullable: true
          description: Always null on success responses
        meta:
          $ref: '#/components/schemas/ApiMeta'

    ApiErrorEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          nullable: true
          type: object
          description: Always null on error responses
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    IssueTokenRequest:
      type: object
      additionalProperties: true
      properties:
        user_id:
          type: string
          default: ""
        role:
          type: string
          enum: [viewer, operator, admin]
          default: viewer
        now:
          type: string
          format: date-time

    IssueTokenData:
      type: object
      required: [token, issued_at]
      properties:
        token:
          type: string
        issued_at:
          type: string
          format: date-time

    RegisterDeviceRequest:
      type: object
      required: [tenant_id, site_id, box_id, device_id, protocol]
      additionalProperties: true
      properties:
        tenant_id:
          type: string
        site_id:
          type: string
        box_id:
          type: string
        device_id:
          type: string
        protocol:
          type: string
          enum: [rtsp, rtmp, onvif, gb28181]
        stream_url:
          type: string
          description: Required for protocol `rtsp`, `rtmp`, and `onvif`
        sip_server:
          type: string
          description: Required for protocol `gb28181`
        sip_port:
          type: integer
          description: Required for protocol `gb28181` (1-65535)
        channel_id:
          type: string
          description: Required for protocol `gb28181`
        transport:
          type: string
          enum: [udp, tcp]
          description: Required for protocol `gb28181`
        enabled:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilities'

    DeviceRecord:
      type: object
      required: [tenant_id, site_id, box_id, device_id, protocol, stream_url, enabled, ingest_spec, capabilities]
      properties:
        tenant_id:
          type: string
        site_id:
          type: string
        box_id:
          type: string
        device_id:
          type: string
        protocol:
          type: string
        stream_url:
          type: string
        enabled:
          type: boolean
        ingest_spec:
          type: object
          additionalProperties: true
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilities'

    DeviceCapabilities:
      type: object
      required: [ocr, face]
      properties:
        ocr:
          type: boolean
        face:
          type: boolean

    UpdateDeviceCapabilitiesRequest:
      type: object
      required: [tenant_id, site_id, box_id, device_id, capabilities]
      additionalProperties: true
      properties:
        tenant_id:
          type: string
        site_id:
          type: string
        box_id:
          type: string
        device_id:
          type: string
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilities'

    UpsertAlgorithmRequest:
      type: object
      required: [algorithm_id, version, status]
      additionalProperties: true
      properties:
        algorithm_id:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [draft, active, disabled]
        capabilities:
          type: array
          items:
            type: string

    AlgorithmRecord:
      type: object
      required: [algorithm_id, version, status, capabilities, updated_at]
      properties:
        algorithm_id:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [draft, active, disabled]
        capabilities:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time

    AlgorithmListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlgorithmRecord'

    UpsertBaseLibraryRequest:
      type: object
      required: [library_id, version, capability, status]
      additionalProperties: true
      properties:
        library_id:
          type: string
        version:
          type: string
        capability:
          type: string
        status:
          type: string
          enum: [draft, active, disabled]
        metadata:
          type: object
          additionalProperties: true

    BaseLibraryRecord:
      type: object
      required: [library_id, version, capability, status, metadata, updated_at]
      properties:
        library_id:
          type: string
        version:
          type: string
        capability:
          type: string
        status:
          type: string
          enum: [draft, active, disabled]
        metadata:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time

    BaseLibraryListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BaseLibraryRecord'

    UpsertBaseLibraryMappingRequest:
      type: object
      required: [tenant_id, site_id, box_id, device_id, capability, library_id, library_version]
      additionalProperties: true
      properties:
        tenant_id:
          type: string
        site_id:
          type: string
        box_id:
          type: string
        device_id:
          type: string
        capability:
          type: string
        library_id:
          type: string
        library_version:
          type: string

    BatchUpsertBaseLibraryMappingsRequest:
      type: object
      required: [items]
      additionalProperties: true
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpsertBaseLibraryMappingRequest'

    BaseLibraryMappingRecord:
      type: object
      required: [tenant_id, site_id, box_id, device_id, capability, library_id, library_version, updated_at]
      properties:
        tenant_id:
          type: string
        site_id:
          type: string
        box_id:
          type: string
        device_id:
          type: string
        capability:
          type: string
        library_id:
          type: string
        library_version:
          type: string
        updated_at:
          type: string
          format: date-time

    BaseLibraryMappingListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BaseLibraryMappingRecord'

    BaseLibraryCompatibilityPolicyData:
      type: object
      required: [enforce_capability_match, required_status, version_regex_by_capability]
      properties:
        enforce_capability_match:
          type: boolean
        required_status:
          type: string
          enum: [draft, active, disabled]
        version_regex_by_capability:
          type: object
          additionalProperties:
            type: string
        semver_range_by_capability:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SemverRangeRule'

    SemverRangeRule:
      type: object
      properties:
        min:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
        max:
          type: string
          pattern: '^\d+\.\d+\.\d+$'

    UpsertOfflineExecutorRequest:
      type: object
      required: [executor_id, endpoint, status]
      additionalProperties: true
      properties:
        executor_id:
          type: string
        endpoint:
          type: string
        status:
          type: string
          enum: [active, drain, disabled]
        capabilities:
          type: array
          items:
            type: string
        last_heartbeat_at:
          type: string
          format: date-time

    OfflineExecutorHeartbeatRequest:
      type: object
      required: [executor_id]
      additionalProperties: true
      properties:
        executor_id:
          type: string
        now:
          type: string
          format: date-time

    OfflineExecutorRecord:
      type: object
      required: [executor_id, endpoint, status, capabilities, last_heartbeat_at, health_state, updated_at]
      properties:
        executor_id:
          type: string
        endpoint:
          type: string
        status:
          type: string
          enum: [active, drain, disabled]
        capabilities:
          type: array
          items:
            type: string
        last_heartbeat_at:
          type: string
        health_state:
          type: string
          enum: [healthy, unknown, stale]
        updated_at:
          type: string
          format: date-time

    OfflineExecutorListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfflineExecutorRecord'

    RegisterEdgeAgentRequest:
      type: object
      required: [agent_id, tenant_id, site_id, box_id, endpoint, status]
      additionalProperties: true
      properties:
        agent_id:
          type: string
        tenant_id:
          type: string
        site_id:
          type: string
        box_id:
