openapi: 3.0.3
info:
  title: RK3588 AI Box P0 Runtime API
  version: 0.1.0
  description: >-
    P0 closed-loop runtime contract for device ingest registry, viewer sessions,
    event ingest, webhook push dispatch, worker controls, auth token issuance,
    metrics, and runtime snapshot.
servers:
  - url: http://127.0.0.1:18080
tags:
  - name: auth
  - name: devices
  - name: viewer
  - name: events
  - name: push
  - name: runtime
paths:
  /api/v1/auth/token:
    post:
      tags: [auth]
      summary: Issue runtime access token
      description: >-
        Issues token for `viewer`, `operator`, or `admin` role. Issuing `admin`
        token requires `X-Bootstrap-Token` header value that matches server config.
      parameters:
        - name: X-Bootstrap-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTokenEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/devices/register:
    post:
      tags: [devices]
      summary: Register or update a device ingest endpoint
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: Device record upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/devices/capabilities:
    post:
      tags: [devices]
      summary: Update OCR/face capabilities for a registered device
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceCapabilitiesRequest'
      responses:
        '200':
          description: Device capabilities updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/devices:
    get:
      tags: [devices]
      summary: List device ingest records
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/viewer-sessions/{streamId}/join:
    post:
      tags: [viewer]
      summary: Register viewer join and warm stream when needed
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NowRequest'
      responses:
        '200':
          description: Viewer session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerSessionEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/viewer-sessions/{streamId}/leave:
    post:
      tags: [viewer]
      summary: Register viewer leave and enter idle pending when applicable
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NowRequest'
      responses:
        '200':
          description: Viewer session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerSessionEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/events:
    post:
      tags: [events]
      summary: Ingest normalized alert event
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEventRequest'
      responses:
        '202':
          description: Event accepted and queued for push dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAcceptedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Duplicate event inside dedupe window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/push/dispatch:
    post:
      tags: [push]
      summary: Dispatch due webhook push tasks immediately
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchPushRequest'
      responses:
        '200':
          description: Dispatch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDispatchEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/push/worker/start:
    post:
      tags: [push]
      summary: Start in-process periodic push worker
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkerRequest'
      responses:
        '200':
          description: Worker start result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartWorkerEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/push/worker/stop:
    post:
      tags: [push]
      summary: Stop in-process periodic push worker
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Worker stop result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopWorkerEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/push/worker/status:
    get:
      tags: [push]
      summary: Read worker running status and interval
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Worker status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerStatusEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/runtime/snapshot:
    get:
      tags: [runtime]
      summary: Runtime state snapshot
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Runtime snapshot and queue/session counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSnapshotEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/runtime/schedule:
    post:
      tags: [runtime]
      summary: Build capability-aware sampling schedule for enabled devices
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeScheduleRequest'
      responses:
        '200':
          description: Capability-aware schedule result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeScheduleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/metrics:
    get:
      tags: [runtime]
      summary: Runtime metrics and storage observability
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Metrics counters and storage stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    StreamId:
      name: streamId
      in: path
      required: true
      schema:
        type: string

  responses:
    UnauthorizedError:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    ForbiddenError:
      description: Token is valid but role lacks required action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    BadRequestError:
      description: Request payload failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'

  schemas:
    ApiMeta:
      type: object
      additionalProperties: true

    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ApiSuccessEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          additionalProperties: true
        error:
          type: object
          nullable: true
          description: Always null on success responses
        meta:
          $ref: '#/components/schemas/ApiMeta'

    ApiErrorEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          nullable: true
          type: object
          description: Always null on error responses
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    IssueTokenRequest:
      type: object
      additionalProperties: true
      properties:
        user_id:
          type: string
          default: ""
        role:
          type: string
          enum: [viewer, operator, admin]
          default: viewer
        now:
          type: string
          format: date-time

    IssueTokenData:
      type: object
      required: [token, issued_at]
      properties:
        token:
          type: string
        issued_at:
          type: string
          format: date-time

    RegisterDeviceRequest:
      type: object
      required: [tenant_id, site_id, box_id, device_id, protocol]
      additionalProperties: true
      properties:
        tenant_id:
          type: string
        site_id:
          type: string
        box_id:
          type: string
        device_id:
          type: string
        protocol:
          type: string
          enum: [rtsp, rtmp, onvif, gb28181]
        stream_url:
          type: string
          description: Required for protocol `rtsp`, `rtmp`, and `onvif`
        sip_server:
          type: string
          description: Required for protocol `gb28181`
        sip_port:
          type: integer
          description: Required for protocol `gb28181` (1-65535)
        channel_id:
          type: string
          description: Required for protocol `gb28181`
        transport:
          type: string
          enum: [udp, tcp]
          description: Required for protocol `gb28181`
        enabled:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilities'

    DeviceRecord:
      type: object
      required: [tenant_id, site_id, box_id, device_id, protocol, stream_url, enabled, ingest_spec, capabilities]
      properties:
        tenant_id:
          type: string
        site_id:
          type: string
        box_id:
          type: string
        device_id:
          type: string
        protocol:
          type: string
        stream_url:
          type: string
        enabled:
          type: boolean
        ingest_spec:
          type: object
          additionalProperties: true
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilities'

    DeviceCapabilities:
      type: object
      required: [ocr, face]
      properties:
        ocr:
          type: boolean
        face:
          type: boolean

    UpdateDeviceCapabilitiesRequest:
      type: object
      required: [tenant_id, site_id, box_id, device_id, capabilities]
      additionalProperties: true
      properties:
        tenant_id:
          type: string
        site_id:
          type: string
        box_id:
          type: string
        device_id:
          type: string
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilities'

    DeviceListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceRecord'

    ViewerSessionData:
      type: object
      required: [stream_id, state, viewer_count]
      properties:
        stream_id:
          type: string
        state:
          type: string
          enum: [ACTIVE, IDLE_PENDING, STOPPED, RESUMING]
        viewer_count:
          type: integer
          minimum: 0

    NowRequest:
      type: object
      additionalProperties: true
      properties:
        now:
          type: string
          format: date-time

    EventPayload:
      type: object
      additionalProperties: true

    EventInput:
      type: object
      required: [tenant_id, site_id, box_id, source_id, event_type]
      additionalProperties: true
      properties:
        tenant_id:
          type: string
        site_id:
          type: string
        box_id:
          type: string
        source_id:
          type: string
        event_type:
          type: string
        object_id:
          type: string
        payload:
          $ref: '#/components/schemas/EventPayload'

    IngestEventRequest:
      type: object
      required: [event]
      additionalProperties: true
      properties:
        now:
          type: string
          format: date-time
        event:
          $ref: '#/components/schemas/EventInput'

    EventAcceptedData:
      type: object
      required: [status, event_id, dedupe_key]
      properties:
        status:
          type: integer
          enum: [202]
        event_id:
          type: string
        dedupe_key:
          type: string

    DispatchPushRequest:
      type: object
      additionalProperties: true
      properties:
        now:
          type: string
          format: date-time
        limit:
          type: integer
          minimum: 1
          default: 20
        mode:
          type: string
          enum: [real, always_success, always_fail]
          default: real

    PushDispatchData:
      type: object
      required: [sent, failed, processed]
      properties:
        sent:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        processed:
          type: integer
          minimum: 0

    StartWorkerRequest:
      type: object
      additionalProperties: true
      properties:
        interval_ms:
          type: integer
          minimum: 1
          default: 500
        limit:
          type: integer
          minimum: 1
          default: 20
        mode:
          type: string
          enum: [real, always_success, always_fail]
          default: real

    StartWorkerData:
      type: object
      required: [started]
      additionalProperties: true
      properties:
        started:
          type: boolean
        interval_seconds:
          type: number
          nullable: true
        max_items:
          type: integer
          nullable: true
        reason:
          type: string
          nullable: true

    StopWorkerData:
      type: object
      required: [stopped]
      additionalProperties: true
      properties:
        stopped:
          type: boolean
        reason:
          type: string
          nullable: true

    WorkerStatusData:
      type: object
      required: [running, interval_seconds]
      properties:
        running:
          type: boolean
        interval_seconds:
          type: number
          nullable: true

    RuntimeSnapshotData:
      type: object
      required: [sessions, device_count, event_dedupe_size, push_queue_size, dead_letter_size]
      properties:
        sessions:
          type: object
          additionalProperties:
            type: object
            properties:
              state:
                type: string
              viewer_count:
                type: integer
              last_transition_at:
                type: string
                format: date-time
        device_count:
          type: integer
          minimum: 0
        event_dedupe_size:
          type: integer
          minimum: 0
        push_queue_size:
          type: integer
          minimum: 0
        dead_letter_size:
          type: integer
          minimum: 0

    RuntimeScheduleRequest:
      type: object
      additionalProperties: true
      properties:
        budget:
          type: number
          minimum: 0.1
          default: 10.0

    RuntimeScheduleStream:
      type: object
      required: [device_id, sample_fps, estimated_cost]
      properties:
        device_id:
          type: string
        sample_fps:
          type: number
        estimated_cost:
          type: number

    RuntimeScheduleData:
      type: object
      required: [degraded, total_cost, streams]
      properties:
        degraded:
          type: boolean
        total_cost:
          type: number
        streams:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeScheduleStream'

    MetricsData:
      type: object
      required:
        - dispatch_runs
        - dispatch_processed
        - dispatch_sent
        - dispatch_failed
        - queue_peak
        - worker_start_count
        - worker_stop_count
        - queue_current
        - dead_letter_current
        - device_count
        - storage_enabled
        - storage
      properties:
        dispatch_runs:
          type: integer
          minimum: 0
        dispatch_processed:
          type: integer
          minimum: 0
        dispatch_sent:
          type: integer
          minimum: 0
        dispatch_failed:
          type: integer
          minimum: 0
        queue_peak:
          type: integer
          minimum: 0
        worker_start_count:
          type: integer
          minimum: 0
        worker_stop_count:
          type: integer
          minimum: 0
        last_dispatch_at:
          type: string
          nullable: true
          format: date-time
        queue_current:
          type: integer
          minimum: 0
        dead_letter_current:
          type: integer
          minimum: 0
        device_count:
          type: integer
          minimum: 0
        storage_enabled:
          type: boolean
        storage:
          nullable: true
          type: object
          additionalProperties: true

    IssueTokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/IssueTokenData'

    DeviceEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceRecord'

    DeviceListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceListData'

    ViewerSessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ViewerSessionData'

    EventAcceptedEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EventAcceptedData'

    PushDispatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PushDispatchData'

    StartWorkerEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StartWorkerData'

    StopWorkerEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StopWorkerData'

    WorkerStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkerStatusData'

    RuntimeSnapshotEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RuntimeSnapshotData'

    RuntimeScheduleEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RuntimeScheduleData'

    MetricsEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MetricsData'
