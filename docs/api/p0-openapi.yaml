openapi: 3.0.3
info:
  title: RK3588 AI Box P0 Runtime API
  version: 0.1.0
  description: >-
    P0 closed-loop runtime contract for device ingest registry, viewer sessions,
    event ingest, webhook push dispatch, worker controls, auth token issuance,
    metrics, and runtime snapshot.
servers:
  - url: http://127.0.0.1:18080
tags:
  - name: auth
  - name: devices
  - name: viewer
  - name: events
  - name: push
  - name: runtime
paths:
  /api/v1/auth/token:
    post:
      tags: [auth]
      summary: Issue runtime access token
      description: >-
        Issues token for `viewer`, `operator`, or `admin` role. Issuing `admin`
        token requires `X-Bootstrap-Token` header value that matches server config.
      parameters:
        - name: X-Bootstrap-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTokenEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/devices/register:
    post:
      tags: [devices]
      summary: Register or update a device ingest endpoint
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: Device record upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/devices/capabilities:
    post:
      tags: [devices]
      summary: Update OCR/face capabilities for a registered device
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceCapabilitiesRequest'
      responses:
        '200':
          description: Device capabilities updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/devices:
    get:
      tags: [devices]
      summary: List device ingest records
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/algorithms:
    get:
      tags: [runtime]
      summary: List algorithm repository metadata
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Algorithm metadata list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgorithmListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/algorithms/upsert:
    post:
      tags: [runtime]
      summary: Upsert algorithm repository metadata
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAlgorithmRequest'
      responses:
        '200':
          description: Upserted algorithm metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgorithmEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/base-libraries:
    get:
      tags: [runtime]
      summary: List base capability libraries
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Base library metadata list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLibraryListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/base-libraries/upsert:
    post:
      tags: [runtime]
      summary: Upsert base capability library metadata
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBaseLibraryRequest'
      responses:
        '200':
          description: Upserted base library metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLibraryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/base-libraries/mappings:
    get:
      tags: [runtime]
      summary: List device-to-base-library mappings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Base library mapping list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLibraryMappingListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/base-libraries/mappings/upsert:
    post:
      tags: [runtime]
      summary: Upsert device-to-base-library mapping
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBaseLibraryMappingRequest'
      responses:
        '200':
          description: Upserted base library mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLibraryMappingEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/base-libraries/mappings/batch-upsert:
    post:
      tags: [runtime]
      summary: Batch upsert device-to-base-library mappings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpsertBaseLibraryMappingsRequest'
      responses:
        '200':
          description: Upserted base library mapping list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLibraryMappingListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/base-libraries/compatibility/policy:
    get:
      tags: [runtime]
      summary: Read base-library compatibility policy
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Base-library compatibility policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLibraryCompatibilityPolicyEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [runtime]
      summary: Update base-library compatibility policy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseLibraryCompatibilityPolicyData'
      responses:
        '200':
          description: Updated base-library compatibility policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLibraryCompatibilityPolicyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-executors:
    get:
      tags: [runtime]
      summary: List offline executors
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Offline executor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineExecutorListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-executors/upsert:
    post:
      tags: [runtime]
      summary: Upsert offline executor
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOfflineExecutorRequest'
      responses:
        '200':
          description: Upserted offline executor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineExecutorEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-executors/heartbeat:
    post:
      tags: [runtime]
      summary: Update offline executor heartbeat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineExecutorHeartbeatRequest'
      responses:
        '200':
          description: Offline executor heartbeat updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineExecutorEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-jobs:
    get:
      tags: [runtime]
      summary: List offline analysis jobs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Offline job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineJobListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-jobs/create:
    post:
      tags: [runtime]
      summary: Create offline analysis job
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfflineJobRequest'
      responses:
        '200':
          description: Created offline analysis job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineJobEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-jobs/status:
    post:
      tags: [runtime]
      summary: Update offline analysis job status
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfflineJobStatusRequest'
      responses:
        '200':
          description: Updated offline analysis job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineJobEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-jobs/status/batch:
    post:
      tags: [runtime]
      summary: Batch update offline analysis job status
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateOfflineJobStatusRequest'
      responses:
        '200':
          description: Updated offline analysis job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineJobListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/edge-agents:
    get:
      tags: [runtime]
      summary: List edge agents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Edge agent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeAgentListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/edge-agents/register:
    post:
      tags: [runtime]
      summary: Register or update edge agent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEdgeAgentRequest'
      responses:
        '200':
          description: Registered edge agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeAgentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/edge-agents/heartbeat:
    post:
      tags: [runtime]
      summary: Update edge agent heartbeat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeAgentHeartbeatRequest'
      responses:
        '200':
          description: Updated edge agent heartbeat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeAgentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/edge-agents/offline-jobs/lease:
    post:
      tags: [runtime]
      summary: Lease one queued offline job for an edge agent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseOfflineJobToEdgeAgentRequest'
      responses:
        '200':
          description: Lease result for edge agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeAgentOfflineJobLeaseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/edge-agents/offline-jobs/lease/start:
    post:
      tags: [runtime]
      summary: Start leased offline job as running by edge agent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOfflineJobWithLeaseRequest'
      responses:
        '200':
          description: Started offline job with lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineJobEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/edge-agents/offline-jobs/lease/renew:
    post:
      tags: [runtime]
      summary: Renew an active offline job lease held by edge agent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewOfflineJobLeaseRequest'
      responses:
        '200':
          description: Renewed offline job lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineJobEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/edge-agents/offline-jobs/lease/release:
    post:
      tags: [runtime]
      summary: Release an active offline job lease held by edge agent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOfflineJobLeaseRequest'
      responses:
        '200':
          description: Released offline job lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineJobEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/edge-agents/offline-jobs/lease/complete:
    post:
      tags: [runtime]
      summary: Complete offline job to terminal status by lease holder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOfflineJobWithLeaseRequest'
      responses:
        '200':
          description: Completed offline job lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineJobEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-sync/cursors:
    get:
      tags: [runtime]
      summary: List offline sync cursors
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Offline sync cursor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncCursorListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-sync/cursors/upsert:
    post:
      tags: [runtime]
      summary: Upsert offline sync cursor with optimistic version check
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOfflineSyncCursorRequest'
      responses:
        '200':
          description: Updated offline sync cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncCursorEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-sync/streams:
    get:
      tags: [runtime]
      summary: List offline sync stream cursors
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Offline sync stream cursor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncStreamCursorListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/offline-sync/streams/upsert:
    post:
      tags: [runtime]
      summary: Upsert offline sync stream cursor with optimistic version check
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOfflineSyncStreamCursorRequest'
      responses:
        '200':
          description: Updated offline sync stream cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncStreamCursorEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/viewer-sessions/{streamId}/join:
    post:
      tags: [viewer]
      summary: Register viewer join and warm stream when needed
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NowRequest'
      responses:
        '200':
          description: Viewer session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerSessionEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/viewer-sessions/{streamId}/leave:
    post:
      tags: [viewer]
      summary: Register viewer leave and enter idle pending when applicable
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NowRequest'
      responses:
        '200':
          description: Viewer session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerSessionEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/events:
    post:
      tags: [events]
      summary: Ingest normalized alert event
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEventRequest'
      responses:
        '202':
          description: Event accepted and queued for push dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAcceptedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Duplicate event inside dedupe window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/push/dispatch:
    post:
      tags: [push]
      summary: Dispatch due webhook push tasks immediately
      description: >-
        Attempts delivery for due queue items. If network policy allowlist is
        enabled and a task target does not match allowed prefixes, that task is
        moved to dead-letter immediately without retry backoff.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchPushRequest'
      responses:
        '200':
          description: Dispatch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDispatchEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/push/worker/start:
    post:
      tags: [push]
      summary: Start in-process periodic push worker
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkerRequest'
      responses:
        '200':
          description: Worker start result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartWorkerEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/push/worker/stop:
    post:
      tags: [push]
      summary: Stop in-process periodic push worker
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
